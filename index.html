<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FirstLight</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#061535">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FirstLight">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    background: #061535;
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ── Loading ───────────────────────────────────────────── */
  .loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; min-height: 100vh;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(56,225,240,.18);
    border-top-color: #38E1F0;
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { font-size: 13px; color: rgba(255,255,255,.35); letter-spacing: .04em; }

  /* ── Login ─────────────────────────────────────────────── */
  .login-page {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    padding: 24px 20px;
  }
  .login-wrap { width: 100%; max-width: 360px; }

  .brand { text-align: center; margin-bottom: 36px; }
  .brand-name {
    font-size: 32px; font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(135deg, #2E7CF7, #38E1F0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand-sub {
    font-size: 11px; color: rgba(255,255,255,.3);
    text-transform: uppercase; letter-spacing: .14em; margin-top: 6px;
  }

  .card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px;
    padding: 28px 24px 24px;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,.45); text-transform: uppercase;
    letter-spacing: .1em; margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 11px;
    padding: 14px 15px;
    font-size: 16px; font-family: inherit;
    color: #fff; outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: rgba(56,225,240,.45); }
  .field input::placeholder { color: rgba(255,255,255,.22); }

  .btn {
    width: 100%; padding: 15px;
    border: none; border-radius: 11px;
    background: linear-gradient(135deg, #2E7CF7, #38E1F0);
    color: #fff; font-size: 16px; font-weight: 700;
    font-family: inherit; cursor: pointer; margin-top: 4px;
    letter-spacing: -.01em;
    transition: opacity .2s;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .err {
    color: #E07878; font-size: 13px;
    text-align: center; margin-top: 14px; min-height: 18px;
    line-height: 1.4;
  }

  /* ── Top bar (shown over briefing) ─────────────────────── */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: rgba(6,21,53,.93);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.07);
    display: flex; flex-direction: column;
    padding: 0 16px;
    padding-top: env(safe-area-inset-top);
  }
  .tb-row1 {
    display: flex; align-items: center; justify-content: space-between;
    height: 50px;
  }
  .tb-brand {
    font-size: 16px; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(135deg, #2E7CF7, #38E1F0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tb-right { display: flex; align-items: center; gap: 10px; }
  .tb-date {
    font-size: 10px; color: rgba(255,255,255,.35);
    font-family: 'IBM Plex Mono', monospace; letter-spacing: .04em;
  }
  .tb-btn {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 8px; color: rgba(255,255,255,.7);
    font-size: 11px; font-weight: 600;
    padding: 6px 12px; cursor: pointer;
    font-family: inherit;
  }
  .tb-ico {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.11);
    color: rgba(255,255,255,.85);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; padding: 0; font-family: inherit;
  }

  /* ── Settings sheet ─────────────────────────────────────── */
  .set-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(4,10,26,.55); z-index: 1100;
  }
  .set-overlay.open { display: block; }
  .set-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1101;
    background: #fff; border-radius: 22px 22px 0 0;
    padding: 8px 22px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease;
    color: #1B2A4A;
  }
  .set-sheet.open { transform: translateY(0); }
  .set-handle { width: 44px; height: 4px; border-radius: 2px; background: #D5DAE6; margin: 8px auto 16px; }
  .set-title { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: #0F2860; margin-bottom: 4px; }
  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-bottom: 1px solid #EDF0F6;
  }
  .set-row:last-child { border-bottom: none; }
  .set-label { font-size: 15px; font-weight: 600; color: #1B2A4A; }
  .seg { display: flex; background: #F1F3F8; border-radius: 10px; padding: 3px; }
  .seg button {
    border: none; background: transparent; font-family: inherit;
    font-size: 13px; font-weight: 700; padding: 8px 16px;
    border-radius: 8px; color: #5A6780; cursor: pointer;
  }
  .seg button.on { background: #0F2860; color: #fff; }
  .ts-btn {
    width: 44px; height: 38px; border: none; border-radius: 10px;
    background: #F1F3F8; font-family: inherit;
    font-size: 15px; font-weight: 800; color: #0F2860; cursor: pointer;
  }

  /* ── Refresh action bar ─────────────────────────────────── */
  .tb-row2 {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px; gap: 8px; row-gap: 8px;
    flex-wrap: wrap;   /* narrow phones: EN/ΕΛ + A−/A+ wrap to their own line */
  }
  .ref-btn {
    padding: 7px 16px;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 8px;
    background: rgba(255,255,255,.06);
    color: rgba(255,255,255,.8);
    font-size: 11px; font-weight: 600; font-family: inherit;
    cursor: pointer; letter-spacing: .02em;
    transition: opacity .2s, background .2s;
    white-space: nowrap;
  }
  .ref-btn:disabled { opacity: .4; cursor: default; }
  .ref-btn.active {
    background: rgba(56,225,240,.12);
    border-color: rgba(56,225,240,.35);
    color: #38E1F0;
  }

  /* ── Hotel picker ───────────────────────────────────────── */
  .hotel-pick {
    position: relative;
    display: flex; align-items: center; gap: 5px;
    padding: 7px 12px;
    border: 1px solid rgba(46,124,247,.35);
    border-radius: 8px;
    background: rgba(46,124,247,.1);
    color: #fff;
    font-size: 11px; font-weight: 600; font-family: inherit;
    cursor: pointer; white-space: nowrap;
    flex: 1; min-width: 0;
    justify-content: space-between;
  }
  .hotel-pick-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hotel-drop {
    display: none;
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 1001;
    background: #0A1F4D;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    overflow: hidden;
    min-width: 190px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  .hotel-drop.open { display: block; }
  .hotel-drop-item {
    display: block; width: 100%;
    background: none; border: none;
    border-bottom: 1px solid rgba(255,255,255,.06);
    color: rgba(255,255,255,.8); font-size: 12px; font-weight: 500;
    font-family: inherit; padding: 12px 14px;
    text-align: left; cursor: pointer;
  }
  .hotel-drop-item:last-child { border-bottom: none; }
  .hotel-drop-item.active { color: #38E1F0; font-weight: 700; }

  .ref-meta {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
    flex-shrink: 0;
  }
  .ref-time {
    font-size: 10px; color: rgba(255,255,255,.35);
    font-family: 'IBM Plex Mono', monospace; letter-spacing: .04em;
  }
  .ref-status {
    font-size: 10px; color: #38E1F0;
    font-family: 'IBM Plex Mono', monospace; letter-spacing: .04em;
    min-height: 13px;
  }

  /* ── Briefing frame ─────────────────────────────────────── */
  .briefing-wrap {
    padding-top: calc(96px + env(safe-area-inset-top));
    height: 100vh; height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #briefing-iframe {
    width: 100%; border: none; display: block;
    height: 100%;
  }

  /* ── Error state ───────────────────────────────────────── */
  .error-page {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px; padding: 32px;
    text-align: center;
  }
  .error-page p { font-size: 14px; color: rgba(255,255,255,.5); line-height: 1.6; }
  .error-page button {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; color: #fff;
    padding: 10px 20px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }

  /* ── Share button ───────────────────────────────────────── */
  .share-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(56,225,240,.1);
    border: 1px solid rgba(56,225,240,.25);
    border-radius: 8px; color: #38E1F0;
    font-size: 11px; font-weight: 600;
    padding: 6px 12px; cursor: pointer;
    font-family: inherit;
  }

  /* ── Share overlay + panel ──────────────────────────────── */
  .share-overlay {
    display: none; position: fixed; inset: 0; z-index: 9998;
    background: rgba(0,0,0,.55);
  }
  .share-overlay.open { display: block; }

  .share-panel {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: #0A1F4D;
    border-top: 1px solid rgba(255,255,255,.1);
    border-radius: 18px 18px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .share-panel.open { display: block; }

  .share-panel-title {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,.35);
    text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px;
  }
  .share-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .share-option {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 14px 16px;
    color: #fff; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; text-align: left;
    transition: background .15s;
  }
  .share-option:active { background: rgba(56,225,240,.12); }
  .share-opt-icon { font-size: 20px; display: block; margin-bottom: 6px; }
  .share-opt-sub { display: block; font-size: 10px; color: rgba(255,255,255,.35); font-weight: 400; margin-top: 2px; }

  /* ── Capturing toast ────────────────────────────────────── */
  .share-toast {
    display: none; position: fixed;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #0A1F4D; border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 18px 24px; z-index: 99999;
    text-align: center; font-size: 13px; color: rgba(255,255,255,.7);
  }
  .share-toast.show { display: block; }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://tqfupsvymisnskiwtjut.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxZnVwc3Z5bWlzbnNraXd0anV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODExMzgsImV4cCI6MjA5NTU1NzEzOH0.t__izStKHDZvhlUtnnfTW4CB7ZtI8SUIPU0qqWGaByQ';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Boot ──────────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await db.auth.getSession();
  session ? await loadBriefing(session) : showLogin();

  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN')  await loadBriefing(session);
    if (event === 'SIGNED_OUT') showLogin();
  });
}

// ── Login ─────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('root').innerHTML = `
    <div class="login-page">
      <div class="login-wrap">
        <div class="brand">
          <div class="brand-name">FirstLight</div>
          <div class="brand-sub">Hotel Morning Briefing</div>
        </div>
        <div class="card">
          <div class="field">
            <label>Email</label>
            <input id="fl-email" type="email" placeholder="you@hotel.com"
                   autocomplete="email" inputmode="email">
          </div>
          <div class="field">
            <label>Password</label>
            <input id="fl-pass" type="password" placeholder="••••••••"
                   autocomplete="current-password">
          </div>
          <button class="btn" id="fl-btn" onclick="signIn()">Sign in</button>
          <div class="err" id="fl-err"></div>
        </div>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('fl-email')?.focus(), 80);

  document.addEventListener('keydown', function handler(e) {
    if (e.key === 'Enter') { signIn(); document.removeEventListener('keydown', handler); }
  });
}

async function signIn() {
  const email = document.getElementById('fl-email')?.value.trim();
  const pass  = document.getElementById('fl-pass')?.value;
  const btn   = document.getElementById('fl-btn');
  if (!email || !pass) { document.getElementById('fl-err').textContent = 'Enter email and password.'; return; }
  btn.textContent = 'Signing in…'; btn.disabled = true;
  const { error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error) {
    document.getElementById('fl-err').textContent = error.message;
    btn.textContent = 'Sign in'; btn.disabled = false;
  }
}

// ── State ─────────────────────────────────────────────────────────
let _hotelId = null;
let _hotels  = [];   // [{id, name}] — all hotels for this user
let _refreshSub = null;

// ── Briefing ──────────────────────────────────────────────────────
async function loadBriefing() {
  showSpinner('Fetching briefing…');

  // Load hotel list once (persists across hotel switches)
  if (_hotels.length === 0) {
    const { data: huRows, error: huErr } = await db
      .from('hotel_users')
      .select('hotel_id');

    if (huErr || !huRows?.length) {
      showError('No hotel assigned to your account.<br>Contact your administrator.');
      return;
    }

    const ids = huRows.map(r => r.hotel_id);
    const { data: hotelRows } = await db
      .from('hotels')
      .select('id, name')
      .in('id', ids);

    _hotels = hotelRows?.length
      ? hotelRows
      : huRows.map(r => ({ id: r.hotel_id, name: 'Hotel' }));

    if (!_hotelId) _hotelId = _hotels[0].id;
  }

  // Fetch latest briefing for the selected hotel
  const { data: b, error: bErr } = await db
    .from('briefings')
    .select('report_date, rendered_html, generated_at')
    .eq('hotel_id', _hotelId)
    .order('report_date', { ascending: false })
    .limit(1)
    .single();

  if (bErr || !b?.rendered_html) {
    showError('No briefing available yet.<br>Check back after the next morning run.');
    return;
  }

  renderBriefing(b);
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

  { id: 'sec-sources',  label: 'Sources',     icon: '🏨', sub: 'Top channels' },
  { id: 'sec-ai',       label: 'AI Insights', icon: '✨', sub: 'Smart summary' },
];

    `<button class="share-option" onclick="shareSection('${s.id}','${s.label}')">

            `<button class="hotel-drop-item${h.id === _hotelId ? ' active' : ''}"
              onclick="switchHotel(event,'${h.id}')">${h.name}</button>`

        </div>
      </div>`

  document.getElementById('root').innerHTML = `
    <div class="top-bar">

            </defs>

              <path d="M50 -2 50 6"/><path d="M96 14 89 18"/><path d="M102 50 94 50"/>
              <path d="M96 86 89 82"/><path d="M50 102 50 94"/><path d="M4 86 11 82"/>
              <path d="M-2 50 6 50"/><path d="M4 14 11 18"/>
            </g>
            <g transform="translate(50,50) scale(.78) translate(-52,-50)">
              <path d="M18 38 38 28 54 33 74 16" stroke="url(#fl-lock-b)" stroke-width="8"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="74" cy="16" r="5" fill="#38E1F0"/>
              <rect x="18" y="50" width="8"  height="36" rx="4" fill="#fff"/>
              <rect x="18" y="50" width="26" height="8"  rx="4" fill="#fff"/>
              <rect x="18" y="64" width="19" height="8"  rx="4" fill="#fff"/>
              <rect x="62" y="50" width="8"  height="36" rx="4" fill="#fff"/>
              <rect x="62" y="78" width="24" height="8"  rx="4" fill="#fff"/>
            </g>
          </svg>
          <span style="font:700 19px/1 'Outfit',sans-serif;letter-spacing:-.02em;color:#fff;margin-top:2px">First<span style="color:#38E1F0">Light</span></span>
        </div>
        <div class="tb-right">
          <button class="tb-ico" id="bell-btn" onclick="enableNotifications()" title="Enable notifications">🔔</button>
          <button class="tb-ico" onclick="showSharePanel()" title="Share">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </button>
          <button class="tb-ico" onclick="openSettings()" title="Settings">

  const iframe = document.getElementById('briefing-iframe');

  }, { once: true });
  iframe.srcdoc = b.rendered_html;

  subscribeRefreshStatus();
}

// ── Text size (levels 1–5, like phone accessibility sizing) ────────
const TS_ZOOM = { 1: 0.85, 2: 1, 3: 1.12, 4: 1.25, 5: 1.4 };
function tsLevel() {
  const n = parseInt(localStorage.getItem('fl_textsize') || '2', 10);
  return Math.min(5, Math.max(1, isNaN(n) ? 2 : n));
}
function setTextSize(delta) {
  const n = Math.min(5, Math.max(1, tsLevel() + delta));
  localStorage.setItem('fl_textsize', String(n));
  const doc = document.getElementById('briefing-iframe')?.contentDocument;
  if (doc) applyTextSize(doc);
}
function applyTextSize(doc) {
  const n = tsLevel();
  if (doc?.body) doc.body.style.zoom = TS_ZOOM[n];
  const lbl = document.getElementById('ts-lvl');
  if (lbl) lbl.textContent = n + ' / 5';
}

// ── Insight feedback (👍/👎 per AI card → insight_feedback table) ───
function injectFeedbackButtons(doc, reportDate) {
  if (!doc) return;
  doc.querySelectorAll('.icard[data-card-id]').forEach(card => {
    const foot = card.querySelector('.icard-foot');
    if (!foot || foot.querySelector('.fl-fb')) return;
    const cardId = card.getAttribute('data-card-id');
    const key = `fl_fb_${_hotelId}_${reportDate}_${cardId}`;
    const prev = localStorage.getItem(key);
    const wrap = doc.createElement('span');
    wrap.className = 'fl-fb';
    wrap.style.cssText = 'display:inline-flex;gap:6px;margin-left:10px;align-items:center';
    [['1', '👍'], ['-1', '👎']].forEach(([v, glyph]) => {
      const btn = doc.createElement('button');
      btn.textContent = glyph;
      btn.style.cssText = 'border:1.5px solid #E2E7F0;background:#fff;border-radius:999px;'
        + 'width:30px;height:30px;font-size:14px;cursor:pointer;padding:0;'
        + (prev === v ? 'border-color:#2E7CF7;background:#E8F0FE;' : '');
      btn.onclick = async () => {
        if (localStorage.getItem(key)) return;
        try {
          await db.from('insight_feedback').insert({
            hotel_id: _hotelId, report_date: reportDate,
            card_id: cardId, verdict: parseInt(v, 10),
          });
          localStorage.setItem(key, v);
          btn.style.borderColor = '#2E7CF7'; btn.style.background = '#E8F0FE';
          wrap.querySelectorAll('button').forEach(o => { o.disabled = true; o.style.cursor = 'default'; });
        } catch (err) { console.warn('feedback failed', err); }
      };
      wrap.appendChild(btn);
    });
    if (prev) wrap.querySelectorAll('button').forEach(o => { o.disabled = true; });
    foot.appendChild(wrap);
  });
}

// ── Briefing language (per hotel; applies from the NEXT morning AI run) ──
function langKey() { return `fl_lang_${_hotelId}`; }
function applyLangState() {
  const cur = localStorage.getItem(langKey()) || 'en';
  ['en', 'el'].forEach(l => {
    const btn = document.getElementById(`lang-${l}`);
    if (btn) btn.classList.toggle('on', l === cur);
  });
}
function openSettings() {
  applyLangState();
  const lbl = document.getElementById('ts-lvl');
  if (lbl) lbl.textContent = tsLevel() + ' / 5';
  document.getElementById('set-overlay').classList.add('open');
  document.getElementById('set-sheet').classList.add('open');
}
function closeSettings() {
  document.getElementById('set-overlay').classList.remove('open');
  document.getElementById('set-sheet').classList.remove('open');
}
async function setLang(lang) {
  try {
    await db.from('hotel_prefs').upsert({ hotel_id: _hotelId, language: lang,
                                          updated_at: new Date().toISOString() });
    localStorage.setItem(langKey(), lang);
    applyLangState();
    const toast = document.getElementById('share-toast');
    if (toast) {
      toast.textContent = lang === 'el'
        ? 'Η γλώσσα αποθηκεύτηκε — ισχύει από το αυριανό πρωινό briefing.'
        : 'Language saved — applies from tomorrow\'s morning briefing.';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }
  } catch (err) { console.warn('lang save failed', err); }
}

// ── Hotel switcher ─────────────────────────────────────────────────
function toggleHotelPicker(e) {
  e.stopPropagation();
  document.getElementById('hotel-drop')?.classList.toggle('open');
}

function switchHotel(e, hotelId) {
  e.stopPropagation();
  document.getElementById('hotel-drop')?.classList.remove('open');
  if (hotelId === _hotelId) return;
  _hotelId = hotelId;
  if (_refreshSub) { db.removeChannel(_refreshSub); _refreshSub = null; }
  // Always land at the TOP of the new hotel's report — a stale #section hash
  // (e.g. from a notification tap) must not survive the switch.
  history.replaceState(null, '', window.location.pathname);
  window.scrollTo(0, 0);
  loadBriefing();
}

// Close picker when clicking anywhere else
document.addEventListener('click', () => {
  document.getElementById('hotel-drop')?.classList.remove('open');
});

// ── Refresh ───────────────────────────────────────────────────────
async function requestRefresh(type) {
  if (!_hotelId) return;
  setRefreshUI('queued');
  await db.from('refresh_commands').insert({ hotel_id: _hotelId, type });
}

function setRefreshUI(state) {
  const btn      = document.getElementById('btn-data');
  const statusEl = document.getElementById('ref-status');
  if (!btn) return;

  const busy = state === 'queued' || state === 'running';
  btn.disabled = busy;

  if (state === 'queued') {
    btn.classList.add('active');
    btn.textContent = '↻ Queued…';
    statusEl.textContent = 'waiting for PC';
  } else if (state === 'running') {
    btn.textContent = '↻ Running…';
    statusEl.textContent = 'fetching data…';
  } else if (state === 'done') {
    statusEl.textContent = 'done — reloading';
    setTimeout(() => loadBriefing(), 1500);
  } else if (state === 'error') {
    btn.disabled = false;
    btn.classList.remove('active');
    btn.textContent = '↻ Refresh Data';
    statusEl.textContent = 'error — try again';
  } else {
    btn.classList.remove('active');
    btn.textContent = '↻ Refresh Data';
    statusEl.textContent = '';
  }
}

function subscribeRefreshStatus() {
  if (_refreshSub) { db.removeChannel(_refreshSub); _refreshSub = null; }
  if (!_hotelId) return;

  _refreshSub = db
    .channel('refresh-cmds')
    .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'refresh_commands',
        filter: `hotel_id=eq.${_hotelId}`,
      },
      payload => {
        const row = payload.new || {};
        if (row.status === 'running') setRefreshUI('running');
        if (row.status === 'done')    setRefreshUI('done');
        if (row.status === 'error')   setRefreshUI('error');
      }
    )
    .subscribe();
}

async function signOut() {
  if (_refreshSub) db.removeChannel(_refreshSub);
  _hotels  = [];
  _hotelId = null;
  await db.auth.signOut();
}

// ── Helpers ───────────────────────────────────────────────────────

// ── Push notifications ────────────────────────────────────────────
const VAPID_PUBLIC_KEY = 'BNhurScgTQdq7pGz55B3_0TVKYvNEstr2XVhZ9Q84Nake5-r-Ujas9QBlrlTPRR1sIWFLO_naItavzS_-0ZmgTM';

function _b64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

// ── Navigate to section (from notification tap) ───────────────────
function navigateToSection(sectionId) {
  const iframe = document.getElementById('briefing-iframe');
  if (!iframe) return;
  const scroll = () => iframe.contentDocument?.getElementById(sectionId)?.scrollIntoView({ behavior: 'smooth' });
  iframe.contentDocument?.readyState === 'complete' ? scroll() : iframe.addEventListener('load', scroll, { once: true });
}

// ── Share ─────────────────────────────────────────────────────────
function showSharePanel() {
  document.getElementById('share-overlay').classList.add('open');
  document.getElementById('share-panel').classList.add('open');
}

function hideSharePanel() {
  document.getElementById('share-overlay').classList.remove('open');
  document.getElementById('share-panel').classList.remove('open');
}

function injectSectionShareButtons(iDoc, iWin) {
  const style = iDoc.createElement('style');
  style.textContent = `
    .fl-share {
      margin-left: auto; background: none;
      border: 1px solid rgba(46,124,247,.4); border-radius: 6px;
      color: #2E7CF7; font-size: 10px; font-weight: 600;
      padding: 3px 9px; cursor: pointer; font-family: var(--font);
      white-space: nowrap; flex-shrink: 0;
    }
    .fl-share:active { background: rgba(46,124,247,.1); }
  `;
  iDoc.head.appendChild(style);

  SHARE_SECTIONS.forEach(({ id, label }) => {
    const anchor = iDoc.getElementById(id);
    if (!anchor) return;
    let sib = anchor.nextElementSibling;
    while (sib && !sib.classList?.contains('sl')) sib = sib.nextElementSibling;
    if (!sib) return;
    const btn = iDoc.createElement('button');
    btn.className = 'fl-share';
    btn.textContent = '↑ Share';
    btn.addEventListener('click', e => { e.preventDefault(); iWin.parent.shareSection(id, label); });
    sib.appendChild(btn);
  });
}

async function shareSection(sectionId, label) {
  hideSharePanel();
  const toast = document.getElementById('share-toast');
  toast.classList.add('show');
  let wrapper = null;
  const iframe = document.getElementById('briefing-iframe');
  const iWin   = iframe?.contentWindow;
  const iDoc   = iframe?.contentDocument;
  try {
    if (!iWin || !iDoc) { toast.classList.remove('show'); return; }

    if (!iWin.html2canvas) {
      await new Promise((res, rej) => {
        const s = iDoc.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.crossOrigin = 'anonymous';
        s.onload = res; s.onerror = rej;
        iDoc.head.appendChild(s);
      });
    }

    const anchor = iDoc.getElementById(sectionId);
    if (!anchor) { toast.classList.remove('show'); return; }

    const anchorIds = new Set(['sec-overview','sec-pickup','sec-pace','sec-sources','sec-ai']);
    wrapper = iDoc.createElement('div');
    wrapper.style.cssText = 'position:absolute;left:-9999px;top:0;width:640px;padding:12px 16px;background:#F0F2F7;';
    let el = anchor.nextElementSibling;
    while (el) {
      if (el.id && anchorIds.has(el.id)) break;
      const clone = el.cloneNode(true);
      clone.querySelectorAll?.('.fl-share').forEach(b => b.remove());
      wrapper.appendChild(clone);
      el = el.nextElementSibling;
    }
    iDoc.body.appendChild(wrapper);
    await new Promise(r => setTimeout(r, 500));

    const canvas = await iWin.html2canvas(wrapper, {
      backgroundColor: '#F0F2F7',
      scale: 2,
      useCORS: true,
      allowTaint: true,
      logging: false,
      onclone: clonedDoc => {
        clonedDoc.querySelectorAll('link[href*="fonts.googleapis"]').forEach(e => e.remove());
        const s = clonedDoc.createElement('style');
        s.textContent = '* { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif !important; }';
        clonedDoc.head.appendChild(s);
      }
    });

    iDoc.body.removeChild(wrapper);
    wrapper = null;
    toast.classList.remove('show');

    await new Promise(res => canvas.toBlob(async blob => {
      const file = new File([blob], `firstlight-${label.toLowerCase().replace(/\s+/g,'-')}.png`, { type: 'image/png' });
      if (navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file], title: `FirstLight — ${label}` });
      } else {
        const a = Object.assign(document.createElement('a'), {
          href: URL.createObjectURL(blob),
          download: `firstlight-${label.toLowerCase()}.png`,
        });
        a.click();
        URL.revokeObjectURL(a.href);
      }
      res();
    }, 'image/png'));
  } catch (e) {
    console.warn('[share]', e);
    if (wrapper) try { iDoc?.body?.removeChild(wrapper); } catch (_) {}
    toast.classList.remove('show');
  }
}

// ── Notifications ─────────────────────────────────────────────────
async function enableNotifications() {
  if (!('serviceWorker' in navigator)) { alert('Service workers not supported in this browser.'); return; }
  if (!('Notification' in window))     { alert('Notifications not supported in this browser.\niOS: add to Home Screen first.'); return; }
  if (!('PushManager' in window))      { alert('Push not supported.\niOS: add app to Home Screen first.'); return; }

  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { alert('Notification permission denied.'); return; }

  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: _b64ToUint8(VAPID_PUBLIC_KEY),
      });
    }

    const { data: { session } } = await db.auth.getSession();
    if (!session) { alert('Not logged in — cannot save subscription.'); return; }

    // Register subscription for every hotel this user has access to
    for (const hotel of _hotels) {
      await db.from('push_subscriptions').upsert(
        { hotel_id: hotel.id, user_id: session.user.id, subscription: sub.toJSON() },
        { onConflict: 'user_id,hotel_id' }
      );
    }

    const btn = document.getElementById('bell-btn');
    if (btn) { btn.style.color = '#38E1F0'; btn.title = 'Notifications on'; }
    alert(`Push notifications enabled for ${_hotels.length} hotel${_hotels.length > 1 ? 's' : ''}!`);
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// ── Service Worker ────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(e => console.warn('[sw]', e));
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data?.type === 'NAVIGATE') navigateToSection(event.data.sectionId);
  });
}

init();
